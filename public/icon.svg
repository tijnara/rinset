<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
        </linearGradient>

        <!-- Electric Cyan Whirlpool Gradients -->
        <linearGradient id="swirlCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="60%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#0369a1" />
        </linearGradient>

        <linearGradient id="swirlGlow" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#67e8f9" />
            <stop offset="50%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="10" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Outer Rounded Squircle Badge (Ensures high contrast on both dark & light tab bars) -->
    <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="14" />

    <!-- Inner Swirl & Laundry Vortex Mark -->
    <g filter="url(#glow)">
        <!-- Outer Wave Arm 1 -->
        <path d="M256 100 C342.3 100 412 169.7 412 256 C412 308.2 386.4 354.4 346.8 382.6 C337.8 389 325 385.2 321.2 374.8 C317.8 365.4 322.2 355 330.6 348.6 C362 324.6 382 286.8 382 244 C382 174.4 325.6 118 256 118 C204.2 118 159.2 149.2 139.6 193.8 C135.2 203.8 123 207.6 113.6 202.8 C104.2 198 100.8 185.8 106 176 C131.6 127.8 189.6 96 256 100 Z" fill="url(#swirlGlow)" />

        <!-- Inner Wave Arm 2 -->
        <path d="M152 256 C152 201.2 193.6 156.4 247.4 152.4 C258.4 151.6 267.4 160.8 266.6 171.8 C265.8 182.8 256.4 191.2 245.4 192.4 C212 196 186 223.6 186 258 C186 295.6 216.4 326 254 326 C282.8 326 307.2 308.2 317 282.8 C321 272.4 332.8 267.6 343 271.8 C353.2 276 357.6 288 353 298.6 C337.8 333.6 301.6 358 258 358 C199.5 358 152 312.3 152 256 Z" fill="url(#swirlCyan)" />

        <!-- Core Water Droplet -->
        <circle cx="256" cy="256" r="28" fill="#38bdf8" />
        <circle cx="250" cy="248" r="8" fill="#ffffff" opacity="0.85" />
    </g>
</svg>